<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ID Card Studio · Visual preview</title><style>
:root{--background:#f5f7fa;--foreground:#172b43;--primary:#126c66;--border:#dce3ea}*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font:14px/1.5 "Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}a{color:#126c66}h1{font-size:29px;font-weight:650;letter-spacing:-.8px;margin:0 0 5px}h2{font-size:18px;font-weight:650;margin:0 0 14px}h3{font-size:15px;font-weight:600;margin:0}p{margin:4px 0 12px}small,.muted{color:#69798d}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.sidebar{background:#102d3a;color:#d9e5e9;padding:30px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;margin:0 8px 44px;font-size:18px;font-weight:650;line-height:1.2}.brand svg{background:#35bca6;color:#082f37;padding:7px;width:39px;height:39px;border-radius:10px}.brand small{display:block;font-size:10px;letter-spacing:2px;color:#a3bdc7;margin-top:7px}.sidebar nav{display:grid;gap:7px}.nav-item{background:none;border:0;border-radius:8px;color:#b8cbd3;display:flex;align-items:center;gap:12px;padding:13px 14px;text-align:left}.nav-item.active{background:#234b57;color:#fff}.sidebar footer{margin-top:auto;padding:18px 10px;border-top:1px solid #33505a;font-size:12px}.dot{display:inline-block;width:7px;height:7px;background:#46c4a7;border-radius:50%;margin-right:7px}.workspace{min-width:0}.topbar{height:76px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 36px;gap:16px}.topbar select{max-width:310px}.content{max-width:1450px;margin:auto;padding:32px 36px}.heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:27px;gap:16px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:10px;font-weight:700;color:#56827f;margin-bottom:10px}.card{background:white;border:1px solid var(--border);border-radius:12px;padding:24px;box-shadow:0 2px 5px #102d3a03}.grid{display:grid;gap:20px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:25px}.stat{display:flex;justify-content:space-between;align-items:start}.stat strong{font-size:30px;display:block;margin-top:10px}.stat svg{color:#458a84;background:#e9f4f1;padding:10px;width:42px;height:42px;border-radius:10px}.two{grid-template-columns:1.2fr 1fr;align-items:start}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.field{display:grid;gap:7px;font-size:12px;font-weight:600}.field input,.field select,.field textarea,input.input,select.input,textarea.input{width:100%;border:1px solid #d3dde5;background:white;border-radius:7px;padding:10px 12px;color:#172b43;font-size:14px;font-weight:400}.field textarea{min-height:110px}.button{border:1px solid transparent;border-radius:7px;padding:10px 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:13px;white-space:nowrap}.primary{background:#126c66;color:white}.outline{border-color:#d3dde5;background:white;color:#294457}.danger{color:#a82332;background:#fff0f1;border-color:#f4cbd0}.ghost{background:transparent;color:#315568}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.divider{height:1px;background:#e8edf1;margin:24px 0}.badge{background:#e8f3ef;color:#267363;border-radius:20px;padding:4px 10px;font-size:11px;display:inline-block}.badge.pending{background:#fff4dc;color:#95661d}.photo-stage{height:340px;border:1px dashed #ccd8de;border-radius:9px;background:#f3f6f8;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;position:relative;margin:18px 0}.photo-stage img{max-height:100%;max-width:100%;object-fit:contain}.photo-stage svg{color:#8da4b1;width:52px;height:52px;margin-bottom:12px}.photo-caption{text-align:center;max-width:270px;color:#718797;font-size:12px}.error{background:#fff1f0;color:#a2352e;border:1px solid #efc8c3;padding:12px 16px;border-radius:8px;margin-bottom:16px}.notice{background:#eaf3f5;color:#416574;padding:12px;border-radius:7px;font-size:12px;margin:12px 0}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#758597;background:#f7f9fa}th,td{padding:13px 12px;border-bottom:1px solid #e8edf1}td small{display:block}.empty{text-align:center;padding:45px 20px;color:#758597}.list-row{padding:15px 0;border-bottom:1px solid #e8edf1;display:flex;justify-content:space-between;gap:15px;align-items:center}.list-row:last-child{border:0}.tabs{display:flex;gap:10px;margin:18px 0}.step{display:inline-flex;background:#e4f2ee;border-radius:6px;width:26px;height:26px;align-items:center;justify-content:center;color:#126c66;margin-right:9px;font-size:12px}.full{grid-column:1/-1}.toolbar{display:flex;gap:12px;margin-bottom:18px;align-items:center;flex-wrap:wrap}.toolbar .input{max-width:270px}.inbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.inbox button{background:white;border:1px solid #dce3ea;border-radius:6px;padding:6px;font-size:10px}.inbox img{width:100%;height:85px;object-fit:contain}.crop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f5f7;padding:15px;border-radius:8px;font-size:12px;max-height:400px;overflow:auto}.unlock{max-width:440px;margin:12vh auto;padding:30px}.progress{height:7px;background:#edf1f3;border-radius:6px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:#36aa95}.institution-logo{width:38px;height:38px;object-fit:contain}.inline-label{display:flex;align-items:center;gap:8px;font-size:12px}.help{font-size:12px;color:#718494;margin-top:7px}@media(max-width:1100px){.shell{grid-template-columns:190px 1fr}.content{padding:24px}.two{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.shell{grid-template-columns:1fr}.sidebar{height:auto;position:static;padding:15px}.brand{margin-bottom:15px}.sidebar nav{display:flex;flex-wrap:wrap}.sidebar footer{display:none}.nav-item{padding:9px;font-size:12px}.topbar{padding:15px;height:auto}.content{padding:18px}.fields{grid-template-columns:1fr}.heading{align-items:start}.stats{gap:10px}.card{padding:18px}}
</style><style>.preview-banner{background:#fff2ce;padding:9px 24px;text-align:center;color:#725210;font-size:12px}.sidebar{height:calc(100vh - 36px)}.icon{width:36px;height:36px;border-radius:9px;background:#e6f3ee;color:#126c66;display:grid;place-items:center;font-size:20px}.avatar{height:190px;width:145px;border-radius:8px;background:#deebe7;display:flex;align-items:center;justify-content:center;color:#326c61;font-size:16px;text-align:center}.card-sample{width:320px;max-width:100%;aspect-ratio:1.585;background:#fff;border:1px solid #d8e3e8;border-radius:10px;overflow:hidden;box-shadow:0 12px 24px #163b4820}.sample-header{background:#126c66;color:#fff;padding:12px 18px;font-weight:700}.sample-body{padding:16px;display:flex;gap:18px;font-size:12px}.sample-photo{width:65px;height:85px;background:#e3eeea;display:grid;place-items:center;color:#6f8c83}.sample-footer{background:#e8f1ef;font-size:10px;text-align:center;padding:7px}.photo-stage{height:320px}.button{text-decoration:none}input[type=checkbox]{accent-color:#126c66} .toast{position:fixed;bottom:24px;right:24px;background:#173c48;color:white;padding:15px 22px;max-width:430px;border-radius:10px;box-shadow:0 5px 30px #0002;z-index:20}.hidden{display:none} .stat strong{font-variant-numeric:tabular-nums}</style></head><body><div class="preview-banner"><b>VISUAL PREVIEW</b> · Fictional sample data · No database, camera, CorelDRAW or printing connection</div><div class="shell"><aside class="sidebar"><div class="brand"><span style="font-size:30px;color:#42c5ac">▣</span><div>ID Card Studio<small>PRODUCTION WORKSPACE</small></div></div><nav id="nav"></nav><footer><span class="dot"></span>Offline design preview<br><span style="color:#8faab6">Your production workspace</span></footer></aside><div class="workspace"><header class="topbar"><span class="muted">Workspace / <strong id="breadcrumb">Dashboard</strong></span><div class="actions"><select class="input" aria-label="Sample institution"><option>Example Public School</option><option>Sample Arts & Science College</option></select><span class="badge pending">Hardware not connected</span></div></header><main class="content" id="main"></main></div></div><div id="toast" class="toast hidden" role="status"></div><script>
const screens=['Dashboard','Schools & colleges','Registration','Student records','Templates','Production','Settings'];
const icons=['▦','▤','＋','☷','▱','▣','⚙'];
let current='Dashboard',samplePhoto=false,approved=false;
const rows=[['Example Student A','EX-001','Class 10 · A','Approved','ready'],['Example Student B','EX-002','Class 10 · A','Pending','draft'],['Example Student C','EX-003','Class 9 · B','Approved','generated'],['Example Student D','EX-004','Class 9 · B','Approved','printed']];
const button=(label,action,variant='primary')=>`<button class="button ${variant}" onclick="${action}">${label}</button>`;
const heading=(eyebrow,title,subtitle,action='')=>`<div class="heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="muted">${subtitle}</p></div>${action}</div>`;
const field=(label,placeholder='',type='text')=>`<label class="field">${label}<input type="${type}" placeholder="${placeholder}"></label>`;
function toast(text='This action requires the installed application. Nothing was saved or sent to hardware.'){document.querySelector('#toast').textContent=text;document.querySelector('#toast').classList.remove('hidden');setTimeout(()=>document.querySelector('#toast').classList.add('hidden'),4500)}
function navigate(name){current=name;document.querySelector('#breadcrumb').textContent=name;document.querySelector('#nav').innerHTML=screens.map((s,i)=>`<button class="nav-item ${s===name?'active':''}" onclick="navigate('${s}')"><span style="width:20px;font-size:20px">${icons[i]}</span>${s}</button>`).join('');document.querySelector('#main').innerHTML=render(name)}
function render(name){
if(name==='Dashboard')return heading('YOUR PRODUCTION OVERVIEW','Welcome to your studio','From student registration to print-ready cards, all in one place.',button('＋ Register student',"navigate('Registration')"))+`<div class="grid stats">${[['Client institutions','2','▤'],['Student records','248','☷'],['Photos pending','36','◉'],['Ready to generate','84','▣'],['Cards generated','76','✓'],['Cards printed','52','▧']].map(([label,count,icon])=>`<div class="card stat"><div><span class="muted">${label}</span><strong>${count}</strong></div><span class="icon">${icon}</span></div>`).join('')}</div><div class="grid two"><section class="card"><div class="actions" style="justify-content:space-between"><h2>Recent projects</h2>${button('View all →',"navigate('Schools & colleges')",'ghost')}</div>${[['Example Public School','2026–2027 · 168 students'],['Sample Arts & Science College','2026–2027 · 80 students']].map(([n,m])=>`<div class="list-row"><div><h3>${n}</h3><small>${m}</small></div>${button('Open project',"navigate('Student records')",'outline')}</div>`).join('')}</section><section class="card"><h2>Production activity</h2><div class="list-row"><div><h3>School classic · Class 10</h3><small>Sample batch · 24 cards</small></div><span class="badge">Completed example</span></div><div class="list-row"><div><h3>College portrait · Science</h3><small>Sample batch · 16 cards</small></div><span class="badge pending">Queued example</span></div><div class="notice">Preview numbers illustrate the dashboard layout. Your installed application starts with an empty database.</div></section></div>`;
if(name==='Registration')return heading('REGISTRATION DESK','New student','Example Public School · 2026–2027',`<span class="badge">Sample registration</span>`)+`<div class="grid two"><section class="card"><h2><span class="step">1</span>Student details</h2><p class="muted">Fields marked * are required when saving a student.</p><div class="divider"></div><form onsubmit="event.preventDefault();toast()"><div class="fields">${field('Full name *','Enter student’s full name')}${field('Student ID *','e.g. EX-005')}<label class="field">Class / department<select><option>Select class</option><option>Class 9</option><option>Class 10</option></select><span class="help">Kept for the next student.</span></label><label class="field">Division<select><option>Select division</option><option>A</option><option>B</option></select><span class="help">Kept for the next student.</span></label><label class="field">Blood group<select><option>Select blood group</option>${['A+','A−','B+','B−','AB+','AB−','O+','O−','Unknown'].map(x=>`<option>${x}</option>`).join('')}</select></label>${field('Date of birth','','date')}</div><div class="divider"></div><div class="actions">${button('Save Draft','toast()','outline')}${button('Save Student','toast()')}${button('Save & Next →',"samplePhoto=false;approved=false;navigate('Registration');toast('Preview reset. No student record was saved.')")}</div></form></section><section class="card"><div class="actions" style="justify-content:space-between"><h2><span class="step">2</span>Student photograph</h2><span id="photo-status" class="badge pending">No photo</span></div><p class="muted">Nikon tethered folder / manual import</p><div class="photo-stage" id="photo-stage"><span style="font-size:48px;color:#8da4b1">◎</span><p class="photo-caption">Your student’s photograph will appear here after reception or import.</p></div><div class="actions">${button('◉ Capture Photo',"toast('The preview has no camera connection. In the installed app, this arms photo reception.')")}<label class="button outline" style="cursor:pointer">↑ Preview a local photo<input type="file" accept="image/jpeg,image/png" hidden onchange="previewPhoto(this.files[0])"></label></div><p class="help">Local preview only: selected images stay in this browser and are not uploaded.</p><div class="divider"></div><div class="actions">${button('✓ Accept Photo',"if(samplePhoto){approved=true;document.querySelector('#photo-status').textContent='Approved · preview';toast('Photo approval shown for preview only.')}else toast('Select a local image first.')")}${button('↻ Retake',"samplePhoto=false;approved=false;navigate('Registration')",'outline')}${button('Crop / Adjust',"toast('The installed React application provides crop, rotation and zoom controls.')",'ghost')}</div></section></div>`;
if(name==='Student records')return heading('EXAMPLE PUBLIC SCHOOL','Student records','Import a class list, photograph students, and prepare production.')+`<section class="card"><div class="toolbar"><input class="input" placeholder="Search sample students…" aria-label="Search sample students" oninput="filterRows(this.value)"><select class="input" aria-label="Filter status" onchange="filterRows(this.value)"><option value="">All students</option><option value="Pending">Photography pending</option><option>ready</option><option>generated</option><option>printed</option></select>${button('Import CSV / Excel','toast()','outline')}${button('Export','toast()','ghost')}</div><div class="table-wrap"><table><thead><tr><th><input type="checkbox" aria-label="Select all" onchange="document.querySelectorAll('.row-check').forEach(c=>c.checked=this.checked)"></th><th>Student</th><th>Class / department</th><th>Photograph</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(([n,id,c,p,s])=>`<tr class="student-row"><td><input type="checkbox" class="row-check" aria-label="Select ${n}"></td><td><strong>${n}</strong><small>${id}</small></td><td>${c}</td><td><span class="badge ${p==='Pending'?'pending':''}">${p}</span></td><td>${s}</td><td>${button('Open',"navigate('Registration')",'ghost')}</td></tr>`).join('')}</tbody></table></div><div class="divider"></div><div class="toolbar"><select class="input" aria-label="Choose template"><option>School classic · front & back</option></select>${button('Generate Cards',"toast('No cards were generated. View Production to inspect the sample job layout.')")}${button('Photograph next student',"navigate('Registration')",'outline')}</div></section>`;
if(name==='Schools & colleges')return heading('CLIENT WORKSPACE','Schools & colleges','Manage your client institutions and registration fields.')+`<div class="grid two"><section class="card"><h2>Your institutions</h2>${['Example Public School','Sample Arts & Science College'].map(n=>`<div class="list-row"><div><h3>${n}</h3><small>2026–2027 · 6 configured fields</small></div>${button('Open',"navigate('Student records')",'outline')}</div>`).join('')}</section><section class="card"><h2>New institution</h2><div class="fields">${field('Institution name','School or college name')}${field('Academic year','2026–2027')}</div><div class="divider"></div><h3>Registration fields</h3>${['Full name','Student ID','Class / department','Division','Blood group','Date of birth'].map((f,i)=>`<div class="list-row"><div>${f}<small>${i<2?'Required':'Optional'}${i===2||i===3?' · Keep for next':''}</small></div><select aria-label="Type for ${f}"><option>${i===4?'Dropdown':i===5?'Date':'Text'}</option><option>Text</option><option>Dropdown</option></select></div>`).join('')}<div class="actions" style="margin-top:20px">${button('＋ Add field','toast()','outline')}${button('Save institution','toast()')}</div></section></div>`;
if(name==='Templates')return heading('DESIGN LIBRARY','CorelDRAW templates','Use your existing CorelDRAW 2019 designs.')+`<div class="grid two"><section class="card"><h2>Registered designs</h2><div class="card-sample"><div class="sample-header">EXAMPLE PUBLIC SCHOOL</div><div class="sample-body"><div class="sample-photo">PHOTO</div><div><strong>STUDENT NAME</strong><br>Student ID: EX-001<br>Class: 10 · A<br>Blood group: O+</div></div><div class="sample-footer">ACADEMIC YEAR 2026–2027 · SAMPLE DESIGN</div></div><div class="list-row"><div><h3>School classic</h3><small>85.6 × 54 mm · Front & back</small></div>${button('Inspect template','toast()','outline')}</div><div class="notice">This illustration is a preview placeholder, not a rendering of a CDR file. Your original design is used by the installed application.</div></section><section class="card"><h2>Register template</h2><div class="fields">${field('Design name','e.g. School classic')}<label class="field">CorelDRAW file<input type="file" accept=".cdr"></label>${field('Card width (mm)','85.6','number')}${field('Card height (mm)','54','number')}</div><div class="divider"></div><h3>Named object → student field</h3>${[['STUDENT_NAME','Full name'],['STUDENT_ID','Student ID'],['CLASS','Class / department'],['STUDENT_PHOTO','Approved photo']].map(([n,f])=>`<div class="list-row"><code>${n}</code><span>→ ${f}</span></div>`).join('')}<div class="actions" style="margin-top:20px">${button('Add mapping','toast()','outline')}${button('Save template','toast()')}</div></section></div>`;
if(name==='Production')return heading('PRODUCTION DESK','Production jobs','Inspect completed cards and arrange print-ready sheets.')+`<div class="grid two"><section class="card"><div class="actions" style="justify-content:space-between"><h2>School classic · Class 10</h2><span class="badge">Completed example</span></div><small>Sample batch · 24 cards</small><div class="progress"><span style="width:100%"></span></div><p class="muted">24 / 24 cards complete · illustrative status</p>${rows.slice(0,3).map(([n])=>`<div class="list-row"><h3>${n}</h3><div class="actions">${button('CDR','toast()','ghost')}${button('Inspect PDF','toast()','ghost')}</div></div>`).join('')}<div class="actions" style="margin-top:18px">${button('Download ZIP','toast()','outline')}</div></section><section class="card"><h2>Arrange print sheets</h2><p class="help">Physical dimensions in millimetres. Print at Actual size / 100%.</p><div class="fields">${field('Sheet width','210','number')}${field('Sheet height','297','number')}${field('Card width','85.6','number')}${field('Card height','54','number')}${field('Margins','10','number')}${field('Gap','5','number')}${field('Bleed per edge','0','number')}<label class="field">Duplex<select><option>Front only</option><option>Flip long edge</option><option>Flip short edge</option></select></label></div><div class="actions" style="margin-top:20px"><label><input type="checkbox" checked> Cutting marks</label>${button('Create print PDF','toast()')}</div></section></div>`;
return heading('LOCAL WORKSTATION','Settings & diagnostics','One computer. Local files. No cloud connection for daily work.')+`<div class="grid two"><section class="card"><h2>Camera reception</h2>${field('Nikon tether output folder','C:\\Photos\\Nikon')}<p class="help">Use the same destination in compatible Nikon tethering software.</p><div class="divider"></div>${field('Unreferenced file retention (days)','30','number')}<div class="actions" style="margin-top:16px">${button('Save settings','toast()')}</div><div class="divider"></div><h2>Owner password</h2>${field('New password','','password')}<div class="actions" style="margin-top:16px">${button('Set password','toast()')}</div></section><section class="card"><h2>Hardware agent</h2><div class="notice">Visual preview only. No hardware agent is connected.</div><div class="list-row"><span>CorelDRAW 2019</span><span class="badge pending">Not connected</span></div><div class="list-row"><span>Nikon camera</span><span class="badge pending">Not connected</span></div><div class="list-row"><span>Direct shutter / live view</span><span class="badge pending">Unavailable</span></div><div class="divider"></div><h3>Backup & restore</h3><p class="help">The installed application provides offline Windows backup and restore scripts. See the project README for setup and hardware verification instructions.</p></section></div>`;
}
function filterRows(q){document.querySelectorAll('.student-row').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(q.toLowerCase()))}
let objectURL;
function previewPhoto(file){if(!file)return;if(!['image/jpeg','image/png'].includes(file.type)){toast('Choose a JPEG or PNG.');return}if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(file);const img=new Image();img.alt='Locally selected preview photograph';img.src=objectURL;document.querySelector('#photo-stage').replaceChildren(img);document.querySelector('#photo-status').textContent='Reviewing · preview';samplePhoto=true;approved=false}
navigate('Dashboard');
</script></body></html>
